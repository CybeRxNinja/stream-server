name: Fork Quick Release (Linux static)

# Fast maintained-fork release for Linux x86_64.
# Builds libtorrent 2.1.1 from source with BUILD_SHARED_LIBS=OFF and
# LIBTORRENT_STATIC=1, so the portable binary has NO
# libtorrent-rasterbar.so runtime dependency and can never fail with:
#   "libtorrent-rasterbar.so.2.0: cannot open shared object file"
#
# NOTE: server binary does not yet support a pure librqbit build upstream
# (server calls EngineFS::new_disk_backed/new_with_storage which only exist
# for LibtorrentBackend, and server/Cargo.toml enables enginefs defaults).
# enginefs library librqbit support was fixed in this fork, but the server
# quick release intentionally uses static libtorrent for reliability.
#
# How to use:
#   1. Actions -> "Fork Quick Release (Linux static)" -> Run workflow -> version e.g. v0.1.8-fork.1
#   2. Or push a tag: git tag v0.1.8-fork.1 && git push origin v0.1.8-fork.1
#   3. Download `stream-server-linux-amd64` from the Release, chmod +x, run.
#
# Full multi-OS release (Windows .exe/.msi, .deb, AppImage, Arch pkg):
# use "Release Build" workflow with a v* tag instead.

on:
  push:
    tags: [ "fork-v*", "v*-fork*", "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.8-fork.1)"
        required: true
        default: "v0.1.8-fork.1"
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false
  LIBTORRENT_STATIC: "1"
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig

jobs:
  build-linux-static:
    name: Build Linux (libtorrent static)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev libclang-dev

      - name: Install libtorrent 2.1.1 (static)
        run: bash .github/scripts/install-libtorrent.sh

      - name: Build server (libtorrent, static)
        run: cargo build --release -p server --features libtorrent --no-default-features

      - name: Verify static linkage (no libtorrent .so)
        run: |
          ls -lh target/release/server
          echo "=== ldd (must NOT mention libtorrent) ==="
          ldd target/release/server || true
          if ldd target/release/server 2>/dev/null | grep -qi libtorrent; then
            echo "::error::binary still links libtorrent dynamically - will fail with libtorrent-rasterbar.so errors"
            exit 1
          fi
          echo "OK: static build, no libtorrent runtime dep"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/server dist/stream-server-linux-amd64
          chmod +x dist/stream-server-linux-amd64
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: quick-linux-static
          path: dist/*

  release:
    name: Create Quick Release
    needs: [build-linux-static]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: quick-linux-static
          path: release

      - name: Resolve tag
        id: reltag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Generate notes
        run: |
          cat > RELEASE_BODY.md << EOF
          ## Stream Server ${{ steps.reltag.outputs.tag }} (maintained fork, Linux static)

          Static libtorrent 2.1.1 build with **no libtorrent-rasterbar.so runtime dependency**.
          Fixes:

          \`\`\`
          stream-server: error while loading shared libraries: libtorrent-rasterbar.so.2.0: cannot open shared object file
          \`\`\`

          ### Install (Linux x86_64)

          \`\`\`bash
          # Download stream-server-linux-amd64 from this release
          chmod +x stream-server-linux-amd64
          ./stream-server-linux-amd64
          # server starts on http://localhost:11470
          \`\`\`

          Verify with \`SHA256SUMS.txt\`.

          Fork: https://github.com/${{ github.repository }}
          Upstream: https://github.com/stremio-native/stream-server
          EOF
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: release/*
          body_path: RELEASE_BODY.md
          generate_release_notes: false
          prerelease: ${{ contains(steps.reltag.outputs.tag, 'beta') || contains(steps.reltag.outputs.tag, 'alpha') || contains(steps.reltag.outputs.tag, 'rc') }}
