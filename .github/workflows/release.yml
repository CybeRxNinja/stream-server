name: Release Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create (e.g. v0.1.9-fork.1). Leave empty to only build without releasing."
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v'))
    env:
      LIBTORRENT_STATIC: "1"
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install cargo-chef
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libssl-dev libfuse2 libboost-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install libtorrent 2.1.1
        run: bash .github/scripts/install-libtorrent.sh

      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cargo Chef Cache
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-check-cargo-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-check-cargo-chef-

      - name: Cargo Chef Cook
        run: |
          cargo chef cook --recipe-path recipe.json --features libtorrent --no-default-features

      - name: Restore Source Code
        run: git restore server enginefs bindings stremio-runtime-stub updater-helper settings-gui

      - name: Run Clippy
        run: cargo clippy --workspace --features libtorrent --no-default-features

      - name: Run Tests
        run: cargo test --workspace --features libtorrent --no-default-features

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
            toolchain: stable
            target: x86_64-pc-windows-msvc

      - name: Install cargo-chef and cargo-wix
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef,cargo-wix

      - name: Cargo Registry Cache
        uses: actions/cache@v6
        with:
          path: |
            C:\Users\runneradmin\.cargo\registry
            C:\Users\runneradmin\.cargo\git
          key: Windows-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            Windows-cargo-registry-

      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);

      - name: Cache vcpkg installed packages
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-x86-64-v3-static-md-release-v1-${{ hashFiles('vcpkg.json','triplets/**','vcpkg-overlays/**') }}
          restore-keys: |
            Windows-vcpkg-x86-64-v3-static-md-release-v1-
            Windows-vcpkg-x86-64-v3-static-md-release-

      - name: Setup vcpkg
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_DEFAULT_TRIPLET: x64-windows-v3-static-md-release
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
          # The overlay pins libtorrent 2.1.1 and carries the complete official
          # vcpkg port for that release, including its verified source checksum.
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays

      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cargo Chef Cache
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-chef-

      - name: Cargo Chef Cook
        run: |
          $env:VCPKG_ROOT = "${{ github.workspace }}\vcpkg"
          cargo chef cook --release --recipe-path recipe.json --target x86_64-pc-windows-msvc --features libtorrent --no-default-features
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-v3-static-md-release\lib\pkgconfig

      - name: Restore Source Code
        run: git restore server enginefs bindings stremio-runtime-stub updater-helper settings-gui

      - name: Build Release
        run: |
          cargo clean -p server --release
          cargo build --release --target x86_64-pc-windows-msvc --features libtorrent --no-default-features
          cargo build --release --target x86_64-pc-windows-msvc -p settings-gui
          cargo build --release --target x86_64-pc-windows-msvc -p stremio-runtime-stub
          cargo build --release --target x86_64-pc-windows-msvc -p updater-helper
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-v3-static-md-release\lib\pkgconfig

      - name: Upload EXE
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-amd64
          path: |
            target/x86_64-pc-windows-msvc/release/server.exe
            target/x86_64-pc-windows-msvc/release/settings-gui.exe
            target/x86_64-pc-windows-msvc/release/stremio-runtime.exe
            target/x86_64-pc-windows-msvc/release/stream-server-updater.exe

      - name: Build MSI Installer
        run: cargo wix --package server --no-build --nocapture --target x86_64-pc-windows-msvc
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}\vcpkg_installed
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          PKG_CONFIG_PATH: ${{ github.workspace }}\vcpkg_installed\x64-windows-v3-static-md-release\lib\pkgconfig


      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: server-windows-msi
          path: target/wix/*.msi

      - name: Debug VCPKG Location
        if: always()
        run: |
          Get-ChildItem -Path . -Force
          if (Test-Path vcpkg) { Get-ChildItem -Path vcpkg -Force }
          if (Test-Path vcpkg_installed) { Get-ChildItem -Path vcpkg_installed -Force }

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      LIBTORRENT_STATIC: "1"
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-chef and cargo-deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-chef,cargo-deb

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config libssl-dev libfuse2 libboost-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install libtorrent 2.1.1
        run: bash .github/scripts/install-libtorrent.sh

      - name: Cargo Chef Prepare
        run: cargo chef prepare --recipe-path recipe.json

      - name: Cargo Chef Cache
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-chef-${{ hashFiles('recipe.json') }}
          restore-keys: |
            ${{ runner.os }}-cargo-chef-

      - name: Cargo Chef Cook
        run: |
          cargo chef cook --release --recipe-path recipe.json --features libtorrent --no-default-features

      - name: Restore Source Code
        run: git restore server enginefs bindings settings-gui

      - name: Build Release (libtorrent, static)
        run: cargo build --release --features libtorrent --no-default-features

      - name: Preserve libtorrent binaries
        run: |
          mkdir -p /tmp/libtorrent-bins
          cp target/release/server /tmp/libtorrent-bins/server
          cp target/release/settings-gui /tmp/libtorrent-bins/settings-gui || true
          # Sanity check: static release must NOT depend on libtorrent .so at runtime
          echo "=== ldd libtorrent build (should show no libtorrent-rasterbar) ==="
          ldd /tmp/libtorrent-bins/server || true
          if ldd /tmp/libtorrent-bins/server 2>/dev/null | grep -qi "libtorrent"; then
            echo "::warning::libtorrent build still links libtorrent dynamically - will cause libtorrent-rasterbar.so errors on other machines"
          else
            echo "OK: no dynamic libtorrent dependency"
          fi

      - name: Build Release (librqbit, no native libtorrent dep)
        # Pure-Rust backend. Zero libtorrent dependency, so it can never hit
        # "libtorrent-rasterbar.so.2.0: cannot open shared object file".
        # Recommended for users who only need a portable binary that just runs.
        run: cargo build --release --no-default-features --features librqbit

      - name: Collect both backends
        run: |
          mkdir -p /tmp/final-bins
          # libtorrent (static) keeps the default names for drop-in compatibility
          cp /tmp/libtorrent-bins/server target/release/server
          cp /tmp/libtorrent-bins/settings-gui target/release/settings-gui || true
          # librqbit gets suffixed names
          cp target/release/server /tmp/final-bins/stream-server-linux-amd64-librqbit 2>/dev/null || cp /tmp/libtorrent-bins/server /tmp/final-bins/stream-server-linux-amd64-librqbit
          # Rebuild librqbit binary path: target/release/server currently IS librqbit after last build
          cp target/release/server /tmp/final-bins/server-librqbit
          cp target/release/settings-gui /tmp/final-bins/settings-gui-librqbit || true
          # Restore libtorrent binaries as canonical target/release outputs (for deb/AppImage)
          cp /tmp/libtorrent-bins/server target/release/server
          cp /tmp/libtorrent-bins/settings-gui target/release/settings-gui || true
          cp /tmp/final-bins/server-librqbit ./stream-server-linux-amd64-librqbit
          cp /tmp/final-bins/settings-gui-librqbit ./stream-server-settings-linux-amd64-librqbit || true
          chmod +x ./stream-server-linux-amd64-librqbit ./stream-server-settings-linux-amd64-librqbit 2>/dev/null || true
          echo "=== ldd librqbit build (must show no libtorrent) ==="
          ldd ./stream-server-linux-amd64-librqbit || true
          ls -lh target/release/server ./stream-server-linux-amd64-librqbit

      - name: Build DEB Package
        run: cargo deb --package server --no-build

      - name: Build AppImage
        run: |
          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

          # Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp target/release/server AppDir/usr/bin/stream-server

          # Create desktop file
          cat > AppDir/usr/share/applications/stream-server.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=Stream Server
          Exec=stream-server
          Icon=stream-server
          Categories=Network;
          EOF

          # Create simple icon (placeholder)
          convert -size 256x256 xc:steelblue -gravity center -pointsize 48 -fill white -annotate 0 "SS" AppDir/usr/share/icons/hicolor/256x256/apps/stream-server.png || echo "ImageMagick not available, using placeholder"

          # Build AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage || true

      - name: Upload Binary
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-amd64
          path: |
            target/release/server
            target/release/settings-gui
            stream-server-linux-amd64-librqbit
            stream-server-settings-linux-amd64-librqbit

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-deb
          path: target/debian/*.deb

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: server-linux-appimage
          path: "*.AppImage"
          if-no-files-found: ignore

  build-arch:
    name: Build Arch Linux
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container: archlinux:latest
    env:
      LIBTORRENT_STATIC: "1"
      PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel cmake curl rust git openssl pkg-config boost clang gtk3 libayatana-appindicator

      - name: Install libtorrent 2.1.1
        run: bash .github/scripts/install-libtorrent.sh

      - name: Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            target
            /root/.cargo/registry
            /root/.cargo/git
          key: arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            arch-cargo-

      - name: Build binary
        run: cargo build --release --features libtorrent --no-default-features

      - name: Create PKGBUILD
        run: |
          mkdir -p pkg
          # Derive pkgver from tag (v1.2.3 -> 1.2.3) or fall back to Cargo version
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG_NAME="${{ inputs.version }}"
          fi
          PKGVER="$(echo "$TAG_NAME" | sed 's/^v//; s/-/_/g')"
          if [ -z "$PKGVER" ] || [ "$PKGVER" = "master" ]; then
            PKGVER="$(grep '^version' server/Cargo.toml | head -n1 | cut -d'"' -f2)"
          fi
          cat > pkg/PKGBUILD << EOF
          # Maintainer: stream-server maintainers (maintained fork of stremio-native/stream-server)
          pkgname=stream-server
          pkgver=${PKGVER:-0.1.8}
          pkgrel=1
          pkgdesc="High-performance torrent streaming server with HLS transcoding (libtorrent static build)"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT')
          depends=('openssl' 'boost-libs' 'gcc-libs' 'glibc')
          source=("stream-server" "settings-gui")
          sha256sums=('SKIP' 'SKIP')

          package() {
              install -Dm755 "\$srcdir/stream-server" "\$pkgdir/usr/bin/stream-server"
              install -Dm755 "\$srcdir/settings-gui" "\$pkgdir/usr/bin/settings-gui"
          }
          EOF
          cat pkg/PKGBUILD

          cp target/release/server pkg/stream-server
          cp target/release/settings-gui pkg/settings-gui

      - name: Build package
        run: |
          cd pkg
          # Create non-root user for makepkg
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -sf --noconfirm"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v7
        with:
          name: server-arch-pkg
          path: pkg/*.pkg.tar.zst

  release:
    name: Create Release
    needs: [build-windows, build-linux, build-arch]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release

          copy_file() {
            src="$1"
            dest="$2"
            [ -f "$src" ] || return 0
            cp "$src" "release/${dest}"
          }

          copy_latest() {
            source_dir="$1"
            pattern="$2"
            dest="$3"
            [ -d "$source_dir" ] || return 0
            src="$(find "$source_dir" -maxdepth 1 -type f -name "$pattern" | sort -V | tail -n 1)"
            [ -n "$src" ] || return 0
            cp "$src" "release/${dest}"
          }

          # Windows
          copy_file artifacts/server-windows-amd64/server.exe stream-server-windows-amd64.exe
          copy_file artifacts/server-windows-amd64/settings-gui.exe stream-server-settings-windows-amd64.exe
          copy_file artifacts/server-windows-amd64/stremio-runtime.exe stremio-runtime-windows-amd64.exe
          copy_file artifacts/server-windows-amd64/stream-server-updater.exe stream-server-updater-windows-amd64.exe
          copy_latest artifacts/server-windows-msi "*.msi" stream-server-windows-amd64.msi
          # Linux (libtorrent static - default, drop-in compatible)
          copy_file artifacts/server-linux-amd64/server stream-server-linux-amd64
          copy_file artifacts/server-linux-amd64/settings-gui stream-server-settings-linux-amd64
          # Linux (librqbit pure-Rust - no libtorrent dependency, immune to libtorrent-rasterbar.so errors)
          copy_file artifacts/server-linux-amd64/stream-server-linux-amd64-librqbit stream-server-linux-amd64-librqbit
          copy_file artifacts/server-linux-amd64/stream-server-settings-linux-amd64-librqbit stream-server-settings-linux-amd64-librqbit
          chmod +x release/stream-server-linux-amd64 release/stream-server-linux-amd64-librqbit 2>/dev/null || true
          copy_latest artifacts/server-linux-deb "*.deb" stream-server-linux-amd64.deb
          copy_latest artifacts/server-linux-appimage "*.AppImage" stream-server-linux-amd64.AppImage
          # Arch
          copy_latest artifacts/server-arch-pkg "stream-server-[0-9]*.pkg.tar.zst" stream-server-arch-x86_64.pkg.tar.zst
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release/

      - name: Resolve release tag
        id: reltag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || true)"
          # On manual dispatch without a git tag object, fall back to latest tag
          if [ "$TAG" = "master" ] || [ -z "$TAG" ]; then
            PREV="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous tag: $PREV"

      - name: Generate release description
        run: |
          python scripts/generate_release_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.reltag.outputs.tag }}" \
            --previous-tag "${{ steps.reltag.outputs.prev }}" \
            --asset-dir release \
            --output "${GITHUB_WORKSPACE}/RELEASE_BODY.md"

          cat "${GITHUB_WORKSPACE}/RELEASE_BODY.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.reltag.outputs.tag }}
          files: release/*
          body_path: ${{ github.workspace }}/RELEASE_BODY.md
          generate_release_notes: false
          prerelease: ${{ contains(steps.reltag.outputs.tag, 'beta') || contains(steps.reltag.outputs.tag, 'alpha') || contains(steps.reltag.outputs.tag, 'rc') }}
